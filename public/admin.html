<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hírek Adminisztráció</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>.force-hidden { display: none !important; }</style>
</head>
<body class="font-sans bg-black">
    <div class="fixed top-0 left-0 w-full h-full -z-10">
        <div class="absolute -inset-[100px] opacity-50">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-[128px] animate-pulse"></div>
            <div class="absolute top-1/2 left-1/3 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-[128px] animate-pulse"></div>
            <div class="absolute top-1/2 left-2/3 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-[128px] animate-pulse"></div>
        </div>
    </div>

    <div class="relative min-h-screen flex flex-col items-center justify-center text-gray-200">
        <div id="loginPanel" class="bg-gray-900/80 backdrop-blur-sm text-gray-200 p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-3xl font-extrabold text-center mb-6">TV Adminisztráció</h2>
            <input type="text" id="username" placeholder="Felhasználónév" class="w-full bg-gray-800 border border-gray-700 p-3 rounded mb-3 text-gray-200 placeholder-gray-500">
            <input type="password" id="password" placeholder="Jelszó" class="w-full bg-gray-800 border border-gray-700 p-3 rounded mb-6 text-gray-200 placeholder-gray-500" onkeypress="if(event.key === 'Enter') handleLogin()">
            <button onclick="handleLogin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded">BEJELENTKEZÉS</button>
            <p id="loginError" class="text-red-500 text-center mt-4 hidden font-bold"></p>
        </div>

        <div id="dashboardPanel" class="force-hidden w-full h-screen bg-transparent overflow-y-auto text-gray-200">
            <div class="max-w-6xl mx-auto p-4 md:p-8">
                <div class="flex justify-between items-center mb-8 bg-gray-900/80 backdrop-blur-sm p-4 rounded shadow sticky top-4 z-10 border border-purple-500/50">
                    <h1 class="text-2xl font-bold text-gray-200">📺 Kezelőpult</h1>
                    <div>
                        <button onclick="logout()" class="text-pink-400 font-bold border border-pink-400/50 px-4 py-2 rounded hover:bg-pink-400/10">Kijelentkezés</button>
                    </div>
                </div>

                <div class="bg-gray-900/80 backdrop-blur-sm p-6 rounded shadow mb-16 border-l-4 border-cyan-500">
                    <h3 class="text-xl font-bold mb-4 text-gray-200">Új bejegyzés hozzáadása</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-400 mb-1">Típus</label>
                        <select id="type" onchange="handleTypeChange()" class="w-full bg-gray-800 border border-gray-700 p-3 rounded text-gray-200">
                            <option value="nothing" style="color: gray;">Semmi</option>
                            <option value="Hír" style="color: #38bdf8;">Hír</option>
                            <option value="Kép" style="color: #fbbf24;">Kép</option>
                            <option value="Videó" style="color: #a78bfa;">Videó</option>
                            <option value="Táblázat" style="color: #22c55e;">Táblázat</option>
                        </select>
                        <div class="mt-3">
                            <button type="button" id="importantBtn" onclick="toggleImportant()" class="px-3 py-2 text-sm font-bold rounded border border-amber-400/60 text-amber-200 bg-amber-500/10 hover:bg-amber-500/20 transition">
                                Fontos: KI
                            </button>
                            <span class="text-xs text-gray-400 ml-2">Kapcsold be, ha sürgős/kiemelt tartalom.</span>
                        </div>
                    </div>

                    <div class="mb-4" id="headlineContainer" style="display: none;">
                        <label class="block text-sm font-bold text-gray-400 mb-1">Címsor</label>
                        <div class="relative">
                            <input type="text" id="headline" maxlength="50" oninput="updateCounts()" class="w-full bg-gray-800 border border-gray-700 p-3 rounded font-bold pr-16 text-gray-200 placeholder-gray-500">
                            <span id="headCount" class="absolute right-3 top-3 text-xs text-gray-500 font-mono">0/50</span>
                        </div>
                    </div>

                    <div class="mb-4" id="bodyContainerWrapper" style="display: none;">
                        <label class="block text-sm font-bold text-gray-400 mb-1">Tartalom (Max 2000)</label>
                        <div class="relative">
                            <textarea id="body" maxlength="2000" oninput="updateCounts()" class="w-full bg-gray-800 border border-gray-700 p-3 rounded h-32 text-gray-200 placeholder-gray-500"></textarea>
                            <span id="bodyCount" class="absolute right-3 bottom-3 text-xs text-gray-500 font-mono bg-gray-800/80 p-1 rounded">0/2000</span>
                        </div>
                    </div>
                    
                    <div class="mb-6 bg-gray-800/80 backdrop-blur-sm p-4 rounded border-dashed border-2 border-gray-700" id="mediaUploadContainer" style="display: none;">
                        <label class="block text-sm font-bold text-gray-200 mb-2">Média feltöltése</label>
                        <input type="file" id="fileInput" accept="image/*,video/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-purple-600 file:text-white hover:file:bg-purple-700">
                    </div>

                    <div class="mb-6 bg-gray-800/80 backdrop-blur-sm p-4 rounded border-dashed border-2 border-gray-700" id="docUploadContainer" style="display: none;">
                        <label class="block text-sm font-bold text-gray-200 mb-2">Dokumentum feltöltése (PDF, DOCX, XLSX, CSV, TXT)</label>
                        <input type="file" id="docInput" accept=".pdf,.docx,.xlsx,.csv,.txt" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-cyan-600 file:text-white hover:file:bg-cyan-700" onchange="handleDocumentUpload()">
                        <p id="docStatus" class="text-xs text-gray-400 mt-2"></p>
                    </div>

                    <button id="pubBtn" onclick="publishNews()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-4 rounded shadow text-lg transition-all">
                        KÖZZÉTÉTEL
                    </button>
                </div>

                <h3 class="text-xl font-bold text-gray-200 mb-4 mt-16">Jelenlegi bejegyzések</h3>
                <div class="mb-4 text-right">
                    <button onclick="deleteAllNews()" class="text-red-400 font-bold border border-red-400/50 px-4 py-2 rounded hover:bg-red-400/10">Összes törlése</button>
                </div>
                <div id="newsList" class="space-y-4 pb-10"></div>
            </div>
        </div>
    </div>

    <div class="hidden text-center text-gray-500 text-sm">
        <p>Project created by Szász Roland</p>
        <p>Open-source, licensed under <a href="https://opensource.org/licenses/MIT" target="_blank" class="text-purple-400 hover:underline">MIT License</a></p>
    </div>

    <script>
        const DEFAULT_IMAGE = '/data/default.jpg'; 
        let lastDocResult = null; // Stores the latest processed document (text/table + url)
        let importantFlag = false; // Tracks if the current entry is marked important

        if(localStorage.getItem('tv_auth') === 'true') showDashboard();

        // Remove legacy warning text about only 12 rows being visible in table mode
        (() => {
            const extraNotes = document.querySelectorAll('#docUploadContainer p');
            extraNotes.forEach((el) => {
                const text = (el.innerText || '').toLowerCase();
                if (text.includes('12 sor') && text.includes('látszik')) {
                    el.remove();
                }
            });
        })();

        function handleTypeChange() {
            const type = document.getElementById('type').value;
            const headlineInput = document.getElementById('headline');
            const headlineContainer = document.getElementById('headlineContainer'); 
            const bodyInput = document.getElementById('body'); 
            const bodyContainerWrapper = document.getElementById('bodyContainerWrapper'); 
            const fileInput = document.getElementById('fileInput');
            const mediaUploadContainer = document.getElementById('mediaUploadContainer'); 
            const docUploadContainer = document.getElementById('docUploadContainer');
            const docInput = document.getElementById('docInput');

            headlineInput.maxLength = 30; 
            resetDocState();
            setImportant(false);

            if (type === 'nothing') {
                headlineContainer.style.display = 'none';
                bodyContainerWrapper.style.display = 'none';
                mediaUploadContainer.style.display = 'none';
                docUploadContainer.style.display = 'none';
                
                headlineInput.value = '';
                bodyInput.value = ''; 
                fileInput.value = ''; 
                docInput.value = '';
            } else {
                headlineContainer.style.display = 'block';
                if (type === 'Videó') {
                    mediaUploadContainer.style.display = 'block';
                    docUploadContainer.style.display = 'none';
                    bodyContainerWrapper.style.display = 'none';
                    bodyInput.value = '';
                    fileInput.accept = 'video/*';
                    fileInput.multiple = false;
                } else if (type === 'Kép') {
                    mediaUploadContainer.style.display = 'block';
                    docUploadContainer.style.display = 'none';
                    bodyContainerWrapper.style.display = 'none';
                    bodyInput.value = '';
                    fileInput.accept = 'image/*';
                    fileInput.multiple = true; // allow multiple images for gallery
                } else if (type === 'Táblázat') {
                    mediaUploadContainer.style.display = 'none';
                    docUploadContainer.style.display = 'block';
                    bodyContainerWrapper.style.display = 'none';
                    bodyInput.value = '';
                    fileInput.value = '';
                    docInput.accept = '.pdf,.docx,.xlsx,.csv,.txt';
                    fileInput.multiple = false;
                } else {
                    mediaUploadContainer.style.display = 'block';
                    docUploadContainer.style.display = 'block';
                    bodyContainerWrapper.style.display = 'block';
                    fileInput.accept = 'image/*';
                    fileInput.multiple = false;
                    docInput.accept = '.pdf,.docx,.xlsx,.csv,.txt';
                }
            }
            updateCounts();
        }

        function updateCounts() {
            const headline = document.getElementById('headline');
            const h = headline.value.length;
            const hMax = headline.maxLength;
            const b = document.getElementById('body').value.length;
            document.getElementById('headCount').innerText = `${h}/${hMax}`;
            const bMax = document.getElementById('body').maxLength || 2000;
            document.getElementById('bodyCount').innerText = `${b}/${bMax}`;
        }

        function setImportant(val) {
            importantFlag = !!val;
            const btn = document.getElementById('importantBtn');
            if (!btn) return;
            if (importantFlag) {
                btn.innerText = 'Fontos: BE';
                btn.classList.add('bg-amber-500/30', 'text-amber-50', 'border-amber-300');
            } else {
                btn.innerText = 'Fontos: KI';
                btn.classList.remove('bg-amber-500/30', 'text-amber-50', 'border-amber-300');
            }
        }

        function toggleImportant() {
            setImportant(!importantFlag);
        }

        function resetDocState() {
            lastDocResult = null;
            const docStatus = document.getElementById('docStatus');
            if (docStatus) docStatus.innerText = '';
            const docInput = document.getElementById('docInput');
            if (docInput) docInput.value = '';
        }

        async function handleDocumentUpload() {
            const docInput = document.getElementById('docInput');
            const docStatus = document.getElementById('docStatus');
            const type = document.getElementById('type').value;
            lastDocResult = null;
            if (!docInput || !docInput.files || docInput.files.length === 0) {
                if (docStatus) docStatus.innerText = '';
                return;
            }

            const file = docInput.files[0];
            if (docStatus) docStatus.innerText = 'Feldolgozás folyamatban...';

            try {
                const fd = new FormData();
                fd.append('document', file);
                const res = await fetch('/api/upload/document', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Feldolgozási hiba');

                lastDocResult = data;

                if (type === 'Táblázat') {
                    if (data.tableData && data.tableData.length > 0) {
                        docStatus.innerText = 'Táblázatos adat beolvasva.';
                    } else if (data.text) {
                        // Fallback: turn lines into a single-column table
                        const rows = data.text.split(/\r?\n/).filter(Boolean).map(line => [line]);
                        lastDocResult.tableData = [['Tartalom'], ...rows];
                        docStatus.innerText = 'Szöveges dokumentum táblázatként mentve.';
                    } else {
                        throw new Error('Nem sikerült táblázatot kinyerni a dokumentumból.');
                    }
                } else {
                    if (data.text) {
                        document.getElementById('body').value = data.text;
                        updateCounts();
                    }
                    docStatus.innerText = 'Dokumentum szövege hozzáadva a tartalomhoz.';
                }
            } catch (err) {
                lastDocResult = null;
                if (docStatus) docStatus.innerText = 'Hiba: ' + err.message;
            }
        }

        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('tv_auth', 'true');
                    showDashboard();
                } else {
                    document.getElementById('loginError').innerText = "Helytelen jelszó";
                    document.getElementById('loginError').classList.remove('hidden');
                    Swal.fire({ icon: 'error', title: 'Hiba', text: 'Helytelen jelszó' });
                }
            } catch(e) { Swal.fire({ icon: 'error', title: 'Hiba', text: 'Szerverhiba' }); }
        }

        function showDashboard() {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('dashboardPanel').classList.remove('force-hidden');
            document.body.classList.remove('bg-gray-900', 'flex', 'items-center', 'justify-center');
            loadNews();
        }

        function logout() { localStorage.removeItem('tv_auth'); location.reload(); }

        async function loadNews() {
            try {
                const res = await fetch('/api/news');
                const data = await res.json();
                const list = document.getElementById('newsList');
                
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500">Nincsenek bejegyzések.</p>';
                    return;
                }

                list.innerHTML = data.map((item) => {
                    const isVideo = item.type === 'Videó';
                    const isImageOnly = item.type === 'Kép';
                    const isTable = item.type === 'Táblázat';
                    const isImportant = item.important || item.type === 'FONTOS';
                    const attachmentLink = item.attachment ? `<a href="${item.attachment}" target="_blank" class="text-sm text-purple-300 underline block mt-2">Csatolt dokumentum megnyitása</a>` : '';

                    let typeLabel = '';
                    if (item.type === 'Hír') typeLabel = `<span class="text-xs font-bold text-cyan-400">${item.type}</span>`;
                    else if (item.type === 'Kép') typeLabel = `<span class="text-xs font-bold text-amber-300">${item.type}</span>`;
                    else if (item.type === 'Videó') typeLabel = `<span class="text-xs font-bold text-purple-400">${item.type}</span>`;
                    else if (item.type === 'Táblázat') typeLabel = `<span class="text-xs font-bold text-green-400">${item.type}</span>`;
                    else if (item.type === 'FONTOS') typeLabel = `<span class="text-xs font-bold text-pink-300">FONTOS</span>`;

                    const importantBadge = isImportant ? `<span class="text-xs font-bold text-pink-300 ml-2">FONTOS</span>` : '';
                    
                    let mainContent = '';
                    let mediaSection = ''; 

                    if (isTable) {
                        if (item.tableData && item.tableData.length > 0) {
                            const headers = item.tableData[0];
                            const rows = item.tableData.slice(1);
                            
                            mainContent = `
                                <div class="overflow-x-auto mt-2 shadow-lg rounded-lg border border-gray-700">
                                    <table class="min-w-full divide-y divide-gray-700">
                                        <thead class="bg-gray-800">
                                            <tr>
                                                ${headers.map(header => `<th scope="col" class="px-4 py-3 text-left text-sm font-medium text-gray-400 uppercase tracking-wider">${header}</th>`).join('')}
                                            </tr>
                                        </thead>
                                        <tbody class="bg-gray-900 divide-y divide-gray-700">
                                            ${rows.map(row => `
                                                <tr>
                                                    ${row.map(cell => `<td class="px-4 py-3 whitespace-nowrap text-base text-gray-300">${cell}</td>`).join('')}
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                                ${attachmentLink}
                            `;
                        } else {
                            mainContent = `<p class="text-gray-500">Nincs megjeleníthető táblázat adat.</p>${attachmentLink}`;
                        }
                    } else { 
                        const bodyContent = (isVideo || isImageOnly) ? '<i class="text-gray-500">Nincs leírás</i>' : item.body;
                        const thumb = isImageOnly && item.images && item.images.length > 0 ? item.images[0] : item.image;
                        mediaSection = isVideo ? 
                            `<video src="${item.image}" class="w-full sm:w-48 h-32 object-cover rounded bg-gray-800 border border-gray-700" muted loop></video>` :
                            `<div class="relative w-full sm:w-48 h-32 rounded bg-gray-800 border border-gray-700 overflow-hidden">
                                <img src="${thumb}" class="w-full h-full object-cover">
                                ${isImageOnly && item.images && item.images.length > 1 ? `<span class="absolute bottom-1 right-1 bg-black/70 text-xs text-white px-2 py-0.5 rounded">${item.images.length} kép</span>` : ''}
                            </div>`;
                        
                        mainContent = `
                            <p class="text-gray-400 text-sm whitespace-pre-wrap line-clamp-3 break-words">${bodyContent}</p>
                            ${attachmentLink}
                        `;
                    }

                    return `
                        <div class="bg-gray-900/80 backdrop-blur-sm p-4 rounded shadow flex flex-col sm:flex-row gap-4 border border-gray-700">
                            ${mediaSection}
                            <div class="flex-1">
                                <h4 class="font-bold text-xl text-gray-200 mb-1">${item.headline}</h4>
                                ${typeLabel} ${importantBadge}
                                ${mainContent}
                            </div>
                            <div class="flex items-center justify-center sm:justify-end">
                                <button onclick="deleteNews(${item.id})" class="bg-pink-600 hover:bg-pink-700 text-white px-6 py-2 rounded shadow font-bold flex items-center gap-2">
                                    TÖRLÉS
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { console.error(e); }
        }

        async function publishNews() {
            const h = document.getElementById('headline').value;
            const b = document.getElementById('body').value;
            const t = document.getElementById('type').value;
            const f = document.getElementById('fileInput').files[0];
            const docFile = document.getElementById('docInput').files[0];
            const btn = document.getElementById('pubBtn');

            const isVideo = t === 'Videó';
            const isImageOnly = t === 'Kép';
            const isTable = t === 'Táblázat';
            const bodyMax = document.getElementById('body').maxLength || 2000;

            // If a document is selected but not yet processed, process it now
            if (docFile && !lastDocResult) {
                await handleDocumentUpload();
            }

            const hasDocText = lastDocResult && lastDocResult.text;
            const hasDocTable = lastDocResult && lastDocResult.tableData && lastDocResult.tableData.length > 0;

            // New validation: Type must be selected
            if (t === 'nothing') {
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'Kérem, válasszon egy típust a közzétételhez!' });
            }

            // --- Validation ---
            if (!h) { // Headline is mandatory for all
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'A címsor megadása kötelező!' });
            }
            if (h.length > 30) { // All headlines max 30
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'A címsor maximum 30 karakter lehet!' });
            }

            // Body content validation (mandatory for all except Videó, Kép és Táblázat, unless a document provided text)
            if (!isVideo && !isImageOnly && !isTable && !b && !hasDocText) {
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'A tartalom vagy egy dokumentum szövege kötelező!' });
            }
            if (!isVideo && !isImageOnly && !isTable && b.length > bodyMax) {
                return Swal.fire({ icon: 'info', title: 'Információ', text: `A tartalom maximum ${bodyMax} karakter lehet!` });
            }

            // File upload validation
            if (isVideo && !f) {
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'Videó közzétételéhez fájl megadása kötelező!' });
            }

            if (isImageOnly && !f) {
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'Kép közzétételéhez legalább egy kép fájl megadása kötelező!' });
            }

            if (isTable && !hasDocTable) {
                return Swal.fire({ icon: 'info', title: 'Információ', text: 'Táblázat típushoz töltsön fel PDF/DOCX/XLSX/CSV/TXT fájlt!' });
            }
            // --- End Validation ---
            btn.innerText = "FELDOLGOZÁS...";
            btn.disabled = true;
            btn.classList.add("opacity-50");

            try {
                let finalMediaUrl = DEFAULT_IMAGE;

                // Upload media (image/video) when applicable
                let galleryUrls = [];
                if (f && !isTable) {
                    if (isImageOnly && document.getElementById('fileInput').files.length > 1) {
                        const files = Array.from(document.getElementById('fileInput').files);
                        for (const imgFile of files) {
                            const fd = new FormData();
                            fd.append('image', imgFile);
                            const upRes = await fetch('/api/upload/image', { method: 'POST', body: fd });
                            const upData = await upRes.json();
                            if(!upRes.ok) throw new Error(upData.error || "A feltöltés sikertelen");
                            galleryUrls.push(upData.url);
                        }
                        finalMediaUrl = galleryUrls[0];
                    } else {
                        const fd = new FormData();
                        const uploadUrl = isVideo ? '/api/upload/video' : '/api/upload/image';
                        const fieldName = isVideo ? 'video' : 'image';
                        fd.append(fieldName, f);
                        
                        const upRes = await fetch(uploadUrl, { method: 'POST', body: fd });
                        const upData = await upRes.json();
                        if(!upRes.ok) throw new Error(upData.error || "A feltöltés sikertelen");
                        finalMediaUrl = upData.url;
                        galleryUrls = [upData.url];
                    }
                }

                const listRes = await fetch('/api/news');
                const list = await listRes.json();

                const newItem = { 
                    id: Date.now(), 
                    headline: h, 
                    body: (isTable || isVideo || isImageOnly) ? '' : (b || (hasDocText ? lastDocResult.text : '')), 
                    image: isTable ? '' : finalMediaUrl,
                    type: t,
                    important: importantFlag
                };

                if (isTable) {
                    newItem.tableData = hasDocTable ? lastDocResult.tableData : [];
                }

                if (isImageOnly) {
                    newItem.images = galleryUrls.length > 0 ? galleryUrls : (finalMediaUrl ? [finalMediaUrl] : []);
                }

                if (lastDocResult && lastDocResult.url) {
                    newItem.attachment = lastDocResult.url;
                }

                list.unshift(newItem);

                const saveRes = await fetch('/api/news', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(list)
                });
                
                if(!saveRes.ok) {
                    const errData = await saveRes.json();
                    throw new Error(errData.error || "Mentés sikertelen");
                }

                document.getElementById('headline').value = '';
                document.getElementById('body').value = '';
                document.getElementById('fileInput').value = '';
                resetDocState();
                setImportant(false);
                handleTypeChange();
                updateCounts();
                loadNews();
                Swal.fire({ icon: 'success', title: 'Sikeres', text: 'Sikeres közzététel!' });
            } finally {
                btn.innerText = "KÖZZÉTÉTEL";
                btn.disabled = false;
                btn.classList.remove("opacity-50");
            }
        }


        async function deleteNews(id) {
            const result = await Swal.fire({
                title: 'Biztos benne?',
                text: "Ezt a műveletet nem lehet visszavonni!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Igen, törlöm!',
                cancelButtonText: 'Mégsem'
            });

            if (!result.isConfirmed) return;
            try {
                const res = await fetch(`/api/news/${id}`, { method: 'DELETE' });
                if(!res.ok) throw new Error("A szerver nem tudta törölni");
                loadNews();
                Swal.fire('Törölve!', 'A bejegyzés sikeresen törölve lett.', 'success');
            } catch(e) { Swal.fire('Hiba!', "Hiba a törlés során: " + e.message, 'error'); }
        }

            const result = await Swal.fire({
                title: 'Biztos benne?',
                text: "Biztosan törli az összes bejegyzést? Ez a művelet nem vonható vissza.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Igen, törlöm mindet!',
                cancelButtonText: 'Mégsem'
            });

            if (!result.isConfirmed) return;

                const res = await fetch('/api/news', { method: 'DELETE' });
                if(!res.ok) throw new Error("A szerver nem tudta törölni az összes bejegyzést");
                loadNews();
                Swal.fire('Törölve!', 'Az összes bejegyzés sikeresen törölve lett.', 'success');
            } catch(e) { Swal.fire('Hiba!', "Hiba a törlés során: " + e.message, 'error'); }
        }
