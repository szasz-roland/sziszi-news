<!DOCTYPE html>
<html>
<head>
    <title>Hírek</title>
    <meta charset="utf-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1c1f26;
            --panel: #20242c;
            --panel-2: #1f232c;
            --border: #2b303b;
            --text: #e5e7eb;
            --accent-blue: #3fa0dc;
            --accent-orange: #f0ae3e;
            --accent-green: #5fb762;
            --accent-red: #e54d42;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); margin: 0; overflow: hidden; color: var(--text); font-family: 'Space Grotesk', 'DM Sans', sans-serif; }
        body.square-all * { border-radius: 0 !important; }
        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: none;
            border-radius: 0;
            backdrop-filter: blur(6px);
        }
        .badge-pill {
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 0;
        }
        .progress-fill {
            transform-origin: left;
            animation: progressFill var(--duration, 6000ms) linear forwards;
        }
        @keyframes progressFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        
        /* Fade In Animation */
        .fade-anim { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Pulse Animation (Waiting Text) */
        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Progress Bar Animation */
        @keyframes loadBar { 
            from { width: 0%; } 
            to { width: 100%; } 
        }

        /* Ken Burns Effect */
        .ken-burns { animation: kenBurns 7s ease-in-out infinite; }
        @keyframes kenBurns { 0% { transform: scale(1) translate(0, 0); } 50% { transform: scale(1.05) translate(-2%, -2%); } 100% { transform: scale(1) translate(0, 0); } }
    </style>
</head>
<body class="square-all">
    <div id="root"></div>

    <script type="text/babel">
        const bellSchedule = {
          "schedule": [
            { "ora": 0, "becsengetes": "07:00", "kicsengetes": "07:45" },
            { "ora": 1, "becsengetes": "08:00", "kicsengetes": "08:45" },
            { "ora": 2, "becsengetes": "09:00", "kicsengetes": "09:45" },
            { "ora": 3, "becsengetes": "09:55", "kicsengetes": "10:40" },
            { "ora": 4, "becsengetes": "10:50", "kicsengetes": "11:35" },
            { "ora": 5, "becsengetes": "11:45", "kicsengetes": "12:30" },
            { "ora": 6, "becsengetes": "12:45", "kicsengetes": "13:30" },
            { "ora": 7, "becsengetes": "13:35", "kicsengetes": "14:20" },
            { "ora": 8, "becsengetes": "14:25", "kicsengetes": "15:10" }
          ]
        };

        function BellSchedule({ time }) {
            const [nextBell, setNextBell] = React.useState(null);

            React.useEffect(() => {
                const now = time;
                const day = now.getDay();
                // Sunday (0) or Saturday (6)
                if (day === 0 || day === 6) {
                    setNextBell({ type: 'Hétvége', time: '' });
                    return;
                }
                const currentTime = now.getHours() * 60 + now.getMinutes();

                let next = null;

                for (const period of bellSchedule.schedule) {
                    const start = parseInt(period.becsengetes.split(':')[0]) * 60 + parseInt(period.becsengetes.split(':')[1]);
                    const end = parseInt(period.kicsengetes.split(':')[0]) * 60 + parseInt(period.kicsengetes.split(':')[1]);

                    if (currentTime < start) {
                        if (!next || start < (parseInt(next.time.split(':')[0]) * 60 + parseInt(next.time.split(':')[1]))) {
                           next = { type: 'becsengetes', time: period.becsengetes, ora: period.ora };
                        }
                    }
                     if (currentTime < end) {
                        if (!next || end < (parseInt(next.time.split(':')[0]) * 60 + parseInt(next.time.split(':')[1]))) {
                            next = { type: 'kicsengetes', time: period.kicsengetes, ora: period.ora };
                        }
                    }
                }
                if(next === null && bellSchedule.schedule.length > 0) {
                   next = { type: 'Vége', time: '' };
                }


                setNextBell(next);

            }, [time]);

            return (
                <div>
                    {nextBell && <p className="text-yellow-300 font-bold text-2xl text-right opacity-90" style={{textShadow: '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000'}}>{nextBell.type === 'Vége' ? 'Vége a tanításnak' : nextBell.type === 'Hétvége' ? 'Hétvége' : `🔔 Csengő: ${nextBell.time}`}</p>}
                </div>
            );
        }

        function Clock() {
            const [time, setTime] = React.useState(new Date());

            React.useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const timeString = time.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            return (
                <div className="absolute top-0 right-0 p-5 pt-8 z-20" >
                    <p className="text-7xl font-bold text-right text-white" style={{textShadow: '0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.9)'}}>{timeString}</p>
                    <BellSchedule time={time} />
                </div>
            );
        }

        function App() {
            const [news, setNews] = React.useState([]);
            const [idx, setIdx] = React.useState(0);
            const [displayDuration, setDisplayDuration] = React.useState(5000);
            const [galleryFrame, setGalleryFrame] = React.useState(0);
            const [showClock, setShowClock] = React.useState(true);
            const videoRef = React.useRef(null);

            // --- CONFIGURATION ---
            const DEFAULT_DISPLAY_TIME = 5000; // 5 seconds for non-video
            // ---------------------

            const loadData = () => {
                fetch('/api/news')
                    .then(r => r.json())
                    .then(data => {
                        setNews(prevNews => {
                            if (JSON.stringify(prevNews) !== JSON.stringify(data)) {
                                return data;
                            }
                            return prevNews;
                        });
                    })
                    .catch(e => console.error(e));
            };

            React.useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 3000); 
                return () => clearInterval(interval);
            }, []);

            // Load UI settings (e.g., clock visibility)
            React.useEffect(() => {
                fetch('/api/settings')
                    .then(r => r.json())
                    .then(settings => {
                        setShowClock(settings && typeof settings.showClock === 'boolean' ? settings.showClock : true);
                    })
                    .catch(() => setShowClock(true));
            }, []);

            // Advance inner gallery frames when Képek is active
            React.useEffect(() => {
                if (news.length === 0) return;
                const currentItem = news[idx];
                if (!currentItem || (currentItem.type !== 'Kép' && currentItem.type !== 'Képek') || !currentItem.images || currentItem.images.length < 2) {
                    setGalleryFrame(0);
                    return;
                }

                setGalleryFrame(0);
                const frameInterval = setInterval(() => {
                    setGalleryFrame(f => (f + 1) % currentItem.images.length);
                }, 4000);

                return () => clearInterval(frameInterval);
            }, [news, idx]);

            React.useEffect(() => {
                if (news.length === 0) return;
        
                const currentItem = news[idx];
                const isVideo = currentItem.type === 'Videó';
                const isImage = currentItem.type === 'Kép' || currentItem.type === 'Képek';
                const isTable = currentItem.type === 'Táblázat';
                const isImportant = currentItem.important || currentItem.type === 'FONTOS';
                let timeoutId;
        
                const advance = () => {
                    setIdx(c => (c + 1) % news.length);
                };
        
                if (isVideo) {
                    const videoElement = videoRef.current;
                    
                    const onMetadataLoaded = () => {
                        const duration = Math.round(videoElement.duration * 1000);
                        setDisplayDuration(duration > 0 ? duration : DEFAULT_DISPLAY_TIME);
                        timeoutId = setTimeout(advance, duration > 0 ? duration : DEFAULT_DISPLAY_TIME);
                    };
        
                    if (videoElement) {
                        videoElement.addEventListener('loadedmetadata', onMetadataLoaded);
                    }
        
                    // Clean up the event listener
                    return () => {
                        if (videoElement) {
                            videoElement.removeEventListener('loadedmetadata', onMetadataLoaded);
                        }
                        clearTimeout(timeoutId);
                    };
                } else if (isImage) {
                    const imageCount = currentItem.images && currentItem.images.length > 0 ? currentItem.images.length : 1;
                    const imageDuration = Math.max(12000, imageCount * 4000); // allow multiple images to play through
                    setDisplayDuration(imageDuration);
                    timeoutId = setTimeout(advance, imageDuration);

                    return () => {
                        clearTimeout(timeoutId);
                    };
                } else if (isTable) {
                    const tableRows = currentItem.tableData ? currentItem.tableData.length : 0;
                    // Estimate reading time: 2 seconds per row, min 10s, max 60s
                    const readingTime = Math.max(10000, Math.min(60000, tableRows * 2000));
                    setDisplayDuration(readingTime);
                    timeoutId = setTimeout(advance, readingTime);
                    
                    // Clean up the timeout
                    return () => {
                        clearTimeout(timeoutId);
                    };
                }
                else {
                    const readingTime = (currentItem.type === 'Hír' || isImportant) && currentItem.body 
                        ? Math.max(5000, Math.min(30000, (currentItem.body.length / 10) * 1000)) 
                        : DEFAULT_DISPLAY_TIME;
                    setDisplayDuration(readingTime);
                    timeoutId = setTimeout(advance, readingTime);
                    
                    // Clean up the timeout
                    return () => {
                        clearTimeout(timeoutId);
                    };
                }
            }, [news, idx]);

            if(news.length === 0) return (
                <div class="h-screen bg-black relative overflow-hidden">
                  <div class="absolute -inset-[100px] opacity-50">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-[128px] animate-pulse"></div>
                    <div class="absolute top-1/2 left-1/3 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-[128px] animate-pulse"></div>
                    <div class="absolute top-1/2 left-2/3 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-[128px] animate-pulse"></div>
                  </div>
                    {showClock && <Clock />}
                    <div className="flex flex-col items-center justify-center h-full text-white">
                        <h1 className="text-5xl font-bold mb-4 text-center" style={{textShadow: '0 0 10px rgba(0,0,0,0.7)'}}>SZISZI hírközlési rendszer</h1>
                        <p className="text-2xl text-gray-300 pulse-text" style={{textShadow: '0 0 5px rgba(0,0,0,0.7)'}}>Várakozás tartalomra...</p>
                    </div>
                </div>
            );

            const item = news[idx];
            if(!item) return null;

            const isUrgent = item.important || item.type === 'FONTOS';
            const isVideo = item.type === 'Videó';
            const isImage = item.type === 'Kép' || item.type === 'Képek';
            const isTable = item.type === 'Táblázat'; // New: check for table type

            return (
                <div className="relative h-screen w-full bg-gradient-to-br from-[#0f172a] via-[#0c1424] to-[#0b1326]">
                    {showClock && <Clock />}

                    {isVideo ? (
                        <div key={item.id} className="absolute inset-0 fade-anim">
                            <div className="absolute inset-0 overflow-hidden">
                                <video
                                    className="absolute inset-0 w-full h-full object-cover blur-[22px] scale-[1.12] opacity-60 pointer-events-none"
                                    src={item.image}
                                    autoPlay
                                    muted
                                    loop
                                    playsInline
                                />
                            </div>
                            <div className="absolute inset-0 bg-gradient-to-b from-black/35 via-black/30 to-[#0b1326]/80"></div>

                            {isUrgent && (
                                <div className="absolute top-6 left-6 z-30">
                                    <span className="badge-pill bg-[#ef4444] text-white text-sm font-extrabold px-4 py-2 rounded-full shadow-[0_10px_26px_rgba(239,68,68,0.35)] ring-2 ring-white/70 ring-offset-2 ring-offset-black/30">Fontos</span>
                                </div>
                            )}

                            <div className="relative h-full w-full flex items-center justify-center px-2 sm:px-4 pt-9 pb-15 z-20">
                                <div className="relative w-full max-w-[94vw] lg:max-w-7xl aspect-video flex items-center justify-center overflow-hidden border border-[var(--border)] bg-[var(--panel)]">
                                    <video
                                        ref={videoRef}
                                        src={item.image}
                                        className="w-full h-full object-contain bg-black"
                                        autoPlay
                                        muted
                                        loop={false}
                                        playsInline
                                    />
                                </div>

                                {item.headline && (
                                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-[var(--panel-2)]/90 text-white px-6 py-3 border border-[var(--border)] flex items-center gap-3" style={{backdropFilter:'blur(10px)'}}>
                                        <span className="text-2xl sm:text-3xl font-black tracking-wide leading-none">{item.headline}</span>
                                        <span className="text-xs sm:text-sm font-semibold bg-[var(--accent-blue)]/15 text-white px-3 py-1 border border-[var(--border)]">Videó</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : isImage ? (
                        <div key={item.id} className="absolute inset-0 fade-anim">
                            <div className="absolute inset-0 bg-cover bg-center blur-[18px] scale-110 opacity-45" style={{ backgroundImage: `url(${(item.images && item.images.length > 0 ? item.images[galleryFrame % item.images.length] : item.image) || item.image})` }}></div>
                            <div className="absolute inset-0 bg-gradient-to-b from-black/35 via-black/30 to-[#0b1326]/80"></div>

                            {isUrgent && (
                                <div className="absolute top-6 left-6 z-30">
                                    <span className="badge-pill bg-[#ef4444] text-white text-sm font-extrabold px-4 py-2 rounded-full shadow-[0_10px_26px_rgba(239,68,68,0.35)] ring-2 ring-white/70 ring-offset-2 ring-offset-black/30">Fontos</span>
                                </div>
                            )}

                            {(() => {
                                const images = (item.images && item.images.length > 0 ? item.images : [item.image || '']).filter(Boolean);
                                const len = images.length || 1;
                                const current = galleryFrame % len;
                                const showCard = (i) => {
                                    const diff = (i - current + len) % len;
                                    if (diff === 0) return { zIndex: 30, scale: 1, translate: 'translateX(0)' , opacity: 1};
                                    if (diff === 1) return { zIndex: 20, scale: 0.9, translate: 'translateX(32px)', opacity: 0.65 };
                                    if (diff === len - 1) return { zIndex: 20, scale: 0.9, translate: 'translateX(-32px)', opacity: 0.65 };
                                    return { zIndex: 10, scale: 0.8, translate: 'translateX(0)', opacity: 0 };
                                };

                                const go = (delta) => {
                                    setGalleryFrame((prev) => (prev + delta + len) % len);
                                };

                                return (
                                    <div className="relative h-full w-full flex items-center justify-center px-2 sm:px-4 pt-9 pb-15 z-20">
                                        <div className="relative w-full max-w-[94vw] lg:max-w-7xl aspect-video flex items-center justify-center">
                                            {images.map((img, i) => {
                                                const style = showCard(i);
                                                return (
                                                    <div
                                                        key={i}
                                                        className="absolute inset-0 flex items-center justify-center transition-all duration-500"
                                                        style={{ zIndex: style.zIndex, transform: `${style.translate} scale(${style.scale})`, opacity: style.opacity }}
                                                    >
                                                        <div className="relative w-full h-full overflow-hidden border border-[var(--border)] bg-[var(--panel)] flex items-center justify-center">
                                                            <img src={img} alt={item.headline} className="w-full h-full object-contain bg-black" />
                                                        </div>
                                                    </div>
                                                );
                                            })}

                                            {len > 1 && (
                                                <React.Fragment>
                                                    <button onClick={() => go(-1)} className="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 bg-[var(--panel-2)]/90 hover:bg-[var(--panel-2)] text-white w-12 h-12 flex items-center justify-center border border-[var(--border)] transition" aria-label="Előző kép">
                                                        <span className="text-2xl">&lt;</span>
                                                    </button>
                                                    <button onClick={() => go(1)} className="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 bg-[var(--panel-2)]/90 hover:bg-[var(--panel-2)] text-white w-12 h-12 flex items-center justify-center border border-[var(--border)] transition" aria-label="Következő kép">
                                                        <span className="text-2xl">&gt;</span>
                                                    </button>
                                                </React.Fragment>
                                            )}
                                        </div>

                                        {item.headline && (
                                            <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-[var(--panel-2)]/90 text-white px-6 py-3 border border-[var(--border)] flex items-center gap-3" style={{backdropFilter:'blur(10px)'}}>
                                                <span className="text-2xl sm:text-3xl font-black tracking-wide leading-none">{item.headline}</span>
                                                {len > 1 && (
                                                    <span className="text-xs sm:text-sm font-semibold bg-[var(--accent-blue)]/15 text-white px-3 py-1 border border-[var(--border)]">{current + 1}/{len}</span>
                                                )}
                                            </div>
                                        )}

                                        {len > 1 && (
                                            <div className="mt-4 flex items-center justify-center gap-3 w-full absolute -bottom-14 left-1/2 -translate-x-1/2">
                                                {images.map((_, i) => (
                                                    <span
                                                        key={i}
                                                        className={`h-2 transition-all duration-300 border border-[var(--border)] ${i === current ? 'w-10 bg-[var(--accent-blue)]' : 'w-3 bg-[var(--panel-2)]'}`}
                                                    ></span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })()}
                        </div>
                    ) : isTable ? (
                        <div key={item.id} className="absolute inset-0 fade-anim">
                            <div className="absolute inset-0 bg-gradient-to-br from-[var(--bg)] via-[#151922] to-[var(--bg)]"></div>

                            {isUrgent && (
                                <div className="absolute top-6 left-6 z-20">
                                    <span className="badge-pill bg-[#ff5f6d] text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg">Fontos</span>
                                </div>
                            )}

                            <div className="relative h-full flex flex-col px-4 sm:px-8 py-8 z-10">
                                <div className="glass-panel p-5 sm:p-7 flex-1 min-h-0 text-[var(--text)] bg-[var(--panel)] border border-[var(--border)]">
                                    <div className="flex flex-wrap items-center gap-3 mb-4">
                                        <span className="badge-pill bg-[var(--accent-blue)] text-white text-xs font-bold px-3 py-1">Táblázat</span>
                                    </div>
                                    <h1 className="text-4xl sm:text-5xl font-extrabold text-[var(--text)] leading-tight mb-5">
                                        {item.headline}
                                    </h1>

                                    {item.tableData && item.tableData.length > 0 ? (
                                        <div className="w-full flex-1 min-h-0 border border-[var(--border)] bg-[#11141c]">
                                            <div className="h-full overflow-auto">
                                                <table className="min-w-full table-fixed divide-y divide-[#2f3642] text-sm md:text-base text-[#e9edf5]">
                                                    <thead className="bg-[#161a23] sticky top-0 z-10 text-[#e9edf5]">
                                                    <tr>
                                                        {item.tableData[0].map((header, i) => (
                                                            <th key={i} scope="col" className="px-4 py-3 text-left font-semibold uppercase tracking-wide whitespace-normal break-words">
                                                                {header}
                                                            </th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                    <tbody className="divide-y divide-[#2f3642]">
                                                        {item.tableData.slice(1, 17).map((row, rowIndex) => (
                                                            <tr key={rowIndex} className={rowIndex % 2 === 0 ? 'bg-[#171b24]' : 'bg-[#1c2029]'}>
                                                                {row.map((cell, cellIndex) => (
                                                                    <td key={cellIndex} className="px-4 py-3 whitespace-normal break-words text-center text-[#e9edf5]">
                                                                        {cell}
                                                                    </td>
                                                                ))}
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex items-center justify-center text-white/60 text-lg">Nincs megjeleníthető táblázat adat.</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <React.Fragment>
                            <div key={item.id} className="absolute inset-0 fade-anim">
                                <div className="absolute inset-0 bg-cover bg-center scale-[1.02] opacity-70" style={{ backgroundImage: `url(${item.image})` }}></div>
                                <div className="absolute inset-0 bg-gradient-to-br from-black/55 via-[#0c1424]/80 to-[#0b1326]/90"></div>
                                <div className="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(56,189,248,0.25),transparent_35%),radial-gradient(circle_at_80%_10%,rgba(244,63,94,0.25),transparent_30%),radial-gradient(circle_at_50%_80%,rgba(79,70,229,0.25),transparent_32%)]"></div>
                            </div>

                            <div className="relative h-full flex items-center px-6 sm:px-10 py-10 lg:py-14 z-10">
                                <div className="max-w-6xl w-full mx-auto glass-panel p-8 sm:p-10 shadow-[0_24px_60px_rgba(0,0,0,0.45)] text-[var(--text)] bg-[var(--panel)] border border-[var(--border)]">
                                    <div className="flex items-center justify-between gap-3 mb-6 flex-wrap">
                                        <div className="flex items-center gap-3 flex-wrap">
                                            {item.type && item.type !== 'nothing' && (
                                                <span className="badge-pill bg-[var(--accent-blue)] text-white text-xs font-bold px-3 py-1">HÍR</span>
                                            )}
                                            {isUrgent && (
                                                <span className="badge-pill bg-[var(--accent-red)] text-white text-sm font-extrabold px-4 py-2 shadow-[0_12px_30px_rgba(229,77,66,0.35)] ring-2 ring-white/40 ring-offset-2 ring-offset-[var(--panel)]">FONTOS</span>
                                            )}
                                        </div>
                                        {/* Live refresh indicator removed per request */}
                                    </div>

                                    <div className="space-y-6">
                                        <h1 className="text-5xl sm:text-6xl lg:text-7xl font-extrabold text-[var(--text)] leading-tight mb-3 drop-shadow-sm">
                                            {item.headline}
                                        </h1>
                                        <p className="text-xl sm:text-2xl text-[var(--text)] leading-relaxed whitespace-pre-wrap break-words bg-[var(--panel-2)] border border-[var(--border)] p-7 shadow-inner">
                                            {item.body}
                                        </p>

                                        {/* Progress indicator moved to global footer bar only */}
                                    </div>
                                </div>
                            </div>
                        </React.Fragment>
                    )}
                    <div className="absolute bottom-4 left-0 right-0 px-6 sm:px-10">
                        <div className="h-2 bg-white/15 rounded-full overflow-hidden border border-white/10 shadow-inner">
                            <div
                                key={`loader-${item.id}-${idx}`}
                                className="h-full w-full progress-fill bg-gradient-to-r from-[#0f3a63] via-[#2563eb] to-[#38bdf8]"
                                style={{ animationDuration: `${displayDuration}ms` }}
                            ></div>
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
